name: CI och deploy

on:
  push:
    branches: ["**"]
    # Content saved in Pages CMS gets the fast track in innehall.yml. A push that touches anything else runs this.
    paths-ignore:
      - "src/data/**"
      - "src/content/**"
      - "src/assets/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # The site lives at https://streetlight-nu.github.io/web until a custom domain is set up.
  # With a custom domain, set the repository variables SITE_URL (e.g. https://streetlight.nu)
  # and BASE_PATH (/) instead of changing this file.
  SITE_URL: ${{ vars.SITE_URL || 'https://streetlight-nu.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/web' }}
  # Funktionsflaggorna (src/data/funktioner.json): only the build on master is production, where a flag set to
  # "ejProduktion" is off. Every other build (branches, pull requests) shows those features.
  MILJO: ${{ github.ref == 'refs/heads/master' && 'produktion' || '' }}

jobs:
  test:
    name: Kontrollera, bygg och testa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typkontroll
        run: npm run check
      - name: Enhetstester
        run: npm test
      - name: Bygg
        run: npm run build
      - name: Installera Chromium för Playwright
        run: npx playwright install --with-deps chromium
      - name: Webbläsartester och tillgänglighet (axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultat
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: dist

  deploy:
    name: Publicera på GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Shared with innehall.yml so two publications never run at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
