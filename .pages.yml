# Pages CMS (https://pagescms.org): the editing forms the association uses.
# Editors sign in with a GitHub account that has write access; a save is committed straight to master,
# and the site is published by GitHub Actions. Instructions for editors (in Swedish): docs/redaktorer.md.
# The fields of Nyheter must match the schema in src/lib/nyheter-schema.ts; tests/unit/pages-cms.test.ts checks it.

# Images are uploaded under src/assets, where Astro finds and optimises them at build time.
# nyheter (the default, first): `output` is the path written into an inlägg, relative to the inlägg's
# folder (src/content/nyheter).
# sidor: the photos on Om Streetlight and Vår historia. The path is written from the site's root,
# `/src/assets/sidor/<file>`, which src/lib/sidbild.ts checks and the component Foto finds.
media:
  - name: nyheter
    label: Nyheter
    input: src/assets/nyheter
    output: ../../assets/nyheter
  - name: sidor
    label: Om Streetlight och Vår historia
    input: src/assets/sidor
    output: /src/assets/sidor

content:
  - name: foreningsuppgifter
    label: Föreningsuppgifter
    type: file
    path: src/data/foreningsuppgifter.json
    format: json
    fields:
      - name: organisationsnummer
        label: Organisationsnummer
        type: string
        description: Visas under Kontakt på Om Streetlight och i sidfoten. Lämna tomt tills det finns, så visas ”nummer fylls i”.
      - name: nittiokonto
        label: Bankgiro
        type: string
        description: Föreningens bankgiro för gåvor. Visas under Kontakt på Om Streetlight. Lämna tomt tills det finns, så visas ”nummer fylls i”.
      - name: swish
        label: Swish-nummer
        type: string
        description: För engångsgåvor. Lämna tomt tills det finns, så visas ”fylls i”.
      - name: epost
        label: Kontakt-e-post
        type: string
        description: Dit blivande faddrar mejlar.
        pattern:
          regex: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Skriv en e-postadress, till exempel namn@exempel.se.
      - name: arsredovisning
        label: Länk till senaste årsredovisningen
        type: string
        description: En hel webbadress som börjar med https://, eller sökvägen till en fil på webbplatsen, till exempel /dokument/streetlight-arsredovisning-2025.pdf. Visas under Kontakt på Om Streetlight och i Vanliga frågor.
        pattern:
          regex: "^$|^https?://\\S+$|^/[^/\\s]\\S*$"
          message: Skriv en hel webbadress som börjar med https://, eller en sökväg som börjar med /dokument/.
      - name: facebook
        label: Facebook-sida
        type: string
        description: Hela adressen till föreningens sida, till exempel https://www.facebook.com/föreningens-namn. Visas i sidfoten och under Kontakt på Om Streetlight. Lämna tomt tills det finns, så visas ”fylls i”.
        pattern:
          regex: "^$|^https://(www\\.)?facebook\\.com/\\S+$"
          message: Skriv hela adressen till sidan, som börjar med https://www.facebook.com/.
      - name: instagram
        label: Instagram-konto
        type: string
        description: Hela adressen till föreningens konto, till exempel https://www.instagram.com/föreningens-namn. Visas i sidfoten och under Kontakt på Om Streetlight. Lämna tomt tills det finns, så visas ”fylls i”.
        pattern:
          regex: "^$|^https://(www\\.)?instagram\\.com/\\S+$"
          message: Skriv hela adressen till kontot, som börjar med https://www.instagram.com/.

  - name: julkampanj
    label: Julkampanjen
    type: file
    path: src/data/julkampanj.json
    format: json
    # The fields must match the schema in src/lib/julkampanj.ts; tests/unit/julkampanj.test.ts checks it.
    # Amounts and the goal are not here: Repejo shows them in its checkout and progress bar.
    fields:
      - name: sistaDag
        label: Sista dagen att ge en julklapp med kort
        type: string
        description: Skriv som du vill att det ska stå, till exempel ”20 december”. Visas överst på sidan Ge en julklapp. Lämna tomt tills det finns, så visas ”fylls i”.
      - name: vadJulklappenGor
        label: Det här gör julklappen
        type: text
        description: En eller två meningar om vad pengarna från julklapparna går till. Visas under ”Vart julklappen går”. Lämna tomt tills det finns, så visas ”fylls i”.
      - name: epost
        label: E-post för frågor om julkampanjen
        type: string
        description: Lämna tomt för att använda föreningens kontakt-e-post.
        pattern:
          regex: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Skriv en e-postadress, till exempel namn@exempel.se.
      - name: visasPaStartsidan
        label: Visa julkampanjen på startsidan och i menyn
        type: boolean
        description: Bocka i när kampanjen pågår. Bocka ur efter jul, så försvinner den från startsidan och menyn. Sidan Ge en julklapp finns kvar.

  - name: funktioner
    label: Funktioner
    type: file
    path: src/data/funktioner.json
    format: json
    # The fields must match the flags in src/lib/funktioner.ts; tests/unit/funktioner.test.ts checks it.
    # A change takes effect when the site is built and published again, which takes a few minutes.
    fields:
      - name: julklapp
        label: Ge en julklapp (sidan, länken i menyn och rutan på startsidan)
        type: select
        required: true
        default: pa
        options:
          values:
            - { value: pa, label: På, visas överallt }
            - { value: av, label: Av, visas ingenstans }
            - { value: ejProduktion, label: Bara i testbyggen, inte på den publicerade sajten }
      - name: historia
        label: Vår historia (sidan och länkarna till den)
        type: select
        required: true
        default: pa
        options:
          values:
            - { value: pa, label: På, visas överallt }
            - { value: av, label: Av, visas ingenstans }
            - { value: ejProduktion, label: Bara i testbyggen, inte på den publicerade sajten }
      - name: engagera
        label: Engagera dig (sidan och länkarna till den)
        type: select
        required: true
        default: pa
        options:
          values:
            - { value: pa, label: På, visas överallt }
            - { value: av, label: Av, visas ingenstans }
            - { value: ejProduktion, label: Bara i testbyggen, inte på den publicerade sajten }

  - name: vanligaFragor
    label: Vanliga frågor
    type: collection
    path: src/content/fragor
    # The file name becomes the question's anchor: /vanliga-fragor#fraga-<question as a slug>. It does not
    # change when the question is reworded. The fields must match the schema in src/lib/vanliga-fragor.ts;
    # tests/unit/vanliga-fragor.test.ts checks it.
    filename: "{primary}.md"
    view:
      fields: [fraga, grupp, ordning]
      primary: fraga
      sort: [grupp, ordning]
      default:
        sort: ordning
        order: asc
    fields:
      - name: fraga
        label: Fråga
        type: string
        required: true
        description: Som en besökare skulle fråga, till exempel ”Hur väljs barnen ut?”.
      - name: grupp
        label: Grupp
        type: select
        required: true
        options:
          values:
            - name: fadder
              label: Att vara fadder
            - name: barnen
              label: Barnen och familjerna
            - name: foreningen
              label: Föreningen
      - name: ordning
        label: Ordning
        type: number
        description: Lägre tal visas först i gruppen, till exempel 1, 2, 3. Får lämnas tomt, så hamnar frågan sist.
      - name: body
        label: Svar
        type: rich-text
        description: "Lämna tomt tills svaret finns, så visas ”fylls i av föreningen”. Skriv {swish}, {epost}, {organisationsnummer}, {nittiokonto} (bankgirot), {arsredovisning}, {facebook} eller {instagram} för att visa uppgiften från Föreningsuppgifter."
        options:
          format: markdown

  - name: historia
    label: Vår historia
    type: file
    path: src/data/historia.json
    format: json
    # The fields must match the schema in src/lib/historia.ts; tests/unit/historia.test.ts checks it.
    fields:
      - name: ingress
        label: Ingress
        type: text
        description: Ett par meningar överst på sidan om hur allt började. Skriv så att ett barn som läser med en vuxen förstår. Lämna tomt tills det finns, så visas ”fylls i”.
      - name: perioder
        label: Perioder
        type: object
        list: true
        description: Tidslinjen, äldst först. Varje period visas som ett eget fält på sidan.
        fields:
          - name: rubrik
            label: Årtal för perioden
            type: string
            required: true
            description: Till exempel 1995–1999 eller 2020–idag. Visas som rubrik och i menyn överst.
          - name: namn
            label: Periodens namn
            type: string
            description: Ett kort namn, till exempel ”De första barnen”.
          - name: sammanfattning
            label: Sammanfattning
            type: text
            description: En mening om vad som hände under perioden.
          - name: bild
            label: Foto från perioden
            type: object
            description: Visas under sammanfattningen.
            fields:
              - name: src
                label: Foto
                type: image
                description: Ladda upp fotot i full storlek. Webbplatsen gör själv mindre versioner. Lämna tomt, så visas ett förslag på vilket foto som passar här.
                options:
                  media: sidor
              - name: alt
                label: Alt-text
                type: string
                description: Krävs när det finns ett foto. Beskriv kort vad fotot visar.
          - name: handelser
            label: Händelser
            type: object
            list: true
            description: Händelserna under perioden, äldst först.
            fields:
              - name: ar
                label: År
                type: string
                description: Till exempel 1995 eller 2003–2004.
              - name: rubrik
                label: Rubrik
                type: string
                description: Vad som hände, med några få ord.
              - name: text
                label: Text
                type: text
                description: Två till fyra korta meningar. Skriv så att ett barn förstår, med enkla ord och gärna något konkret, som en skola, en uniform eller en dag. Berätta om barn och familjer med värdighet och bara med deras samtycke.
              - name: citat
                label: Citat
                type: string
                description: Några ord att minnas, som visas stort efter texten, till exempel Det räcker med en. Skriv utan citattecken. Bara ord som någon verkligen har sagt eller skrivit. Får lämnas tomt.
      - name: idagBild
        label: Foto till Idag
        type: object
        description: Visas sist i tidslinjen, under rubriken Idag.
        fields:
          - name: src
            label: Foto
            type: image
            description: Ladda upp fotot i full storlek. Webbplatsen gör själv mindre versioner. Lämna tomt, så visas ett förslag på vilket foto som passar här.
            options:
              media: sidor
          - name: alt
            label: Alt-text
            type: string
            description: Krävs när det finns ett foto. Beskriv kort vad fotot visar.

  - name: omForeningen
    label: Om Streetlight
    type: file
    path: src/data/om-foreningen.json
    format: json
    # The fields must match the schema in src/lib/om-foreningen.ts; tests/unit/om-foreningen.test.ts checks it.
    # The headings are the page's own. Kontakt comes from Föreningsuppgifter.
    fields:
      - name: ingress
        label: Ingress
        type: text
        description: Ett par meningar överst på sidan om vilka vi är. Lämna tomt tills det finns, så visas ”fylls i”.
      - name: vision
        label: Vår vision
        type: text
        description: Visionen i en mening. Visas med stor text. Orden ”ljus framtid” markeras med guld.
      - name: visionText
        label: Text under visionen
        type: text
        description: Två eller tre korta meningar om vad visionen betyder. Får lämnas tomt.
      - name: tror
        label: Det här tror vi på
        type: object
        list: true
        description: Det som styr arbetet, en tanke i taget. Visas som en lista.
        fields:
          - name: rubrik
            label: Rubrik
            type: string
            description: En kort mening som bär tanken, till exempel ”Skolan öppnar vägen.”.
          - name: text
            label: Text
            type: text
            description: Tre eller fyra korta meningar.
      - name: borjan
        label: Så började det
        type: text
        description: Berättelsen om hur Streetlight började. Lämna en tom rad mellan styckena.
      - name: borjanBild
        label: Foto till Så började det
        type: object
        description: Visas under årtalet 1995.
        fields:
          - name: src
            label: Foto
            type: image
            description: Ladda upp fotot i full storlek. Webbplatsen gör själv mindre versioner. Lämna tomt, så visas ett förslag på vilket foto som passar här.
            options:
              media: sidor
          - name: alt
            label: Alt-text
            type: string
            description: Krävs när det finns ett foto. Beskriv kort vad fotot visar.
      - name: foreningar
        label: Två föreningar, ett arbete
        type: text
        description: Om Streetlight Sverige, Streetlight Etiopien och hur barnen väljs ut. Lämna en tom rad mellan styckena.
      - name: foreningarBild
        label: Foto till Två föreningar, ett arbete
        type: object
        description: Visas under rubriken.
        fields:
          - name: src
            label: Foto
            type: image
            description: Ladda upp fotot i full storlek. Webbplatsen gör själv mindre versioner. Lämna tomt, så visas ett förslag på vilket foto som passar här.
            options:
              media: sidor
          - name: alt
            label: Alt-text
            type: string
            description: Krävs när det finns ett foto. Beskriv kort vad fotot visar.
      - name: styrelser
        label: Vilka vi är
        type: object
        list: true
        description: Föreningens styrelse.
        fields:
          - name: forening
            label: Förening
            type: string
            required: true
            description: Föreningens namn, Streetlight.
          - name: personer
            label: Personer i styrelsen
            type: object
            list: true
            description: Ett tomt namn visas som ”fylls i”.
            fields:
              - name: namn
                label: Namn
                type: string
              - name: roll
                label: Roll
                type: string
                description: Till exempel Ordförande, Kassör eller Ledamot.
              - name: ort
                label: Ort
                type: string
                description: Där personen bor, till exempel Umeå. Lämna tomt tills det finns, så visas ”ort fylls i”.
      - name: vilkaBild
        label: Foto till Vilka vi är
        type: object
        description: Visas under rubriken, till exempel ett foto av styrelsen.
        fields:
          - name: src
            label: Foto
            type: image
            description: Ladda upp fotot i full storlek. Webbplatsen gör själv mindre versioner. Lämna tomt, så visas ett förslag på vilket foto som passar här.
            options:
              media: sidor
          - name: alt
            label: Alt-text
            type: string
            description: Krävs när det finns ett foto. Beskriv kort vad fotot visar.

  - name: nyheter
    label: Nyheter
    type: collection
    path: src/content/nyheter
    # The file name becomes the inlägg's address: /nyheter/<title as a slug>. {primary} is the primary
    # field (view.primary, the title), which Pages CMS slugifies when the inlägg is created.
    filename: "{primary}.md"
    view:
      fields: [title, topic, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
        description: Blir också inläggets adress. Adressen ändras inte om du byter titel senare.
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: topic
        label: Ämne
        type: select
        required: true
        options:
          values:
            - name: rapport
              label: Rapport från Addis Abeba
            - name: forening
              label: Nyhet från föreningen
            - name: familj
              label: Berättelse från en familj
            - name: tack
              label: Tack till faddrarna
      - name: place
        label: Plats
        type: string
        description: Var det hände, till exempel Addis Abeba. Får lämnas tomt.
      - name: lede
        label: Ingress
        type: text
        required: true
        description: Ett par meningar. Visas i nyhetslistan och när någon delar länken.
      - name: image
        label: Bild
        type: image
        description: Ladda upp bilden i full storlek. Webbplatsen gör själv mindre versioner.
        options:
          media: nyheter
      - name: imageAlt
        label: Alt-text
        type: string
        description: Krävs när det finns en bild. Beskriv kort vad bilden visar.
      - name: example
        label: Exempelinlägg
        type: boolean
        description: Bara för de påhittade exempelinläggen. Lämna tomt.
      - name: body
        label: Brödtext
        type: rich-text
        options:
          format: markdown
